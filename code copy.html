<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              magenta: "#E91E63",
              cyan: "#00E5FF",
              purple: "#9C27B0",
              darkBg: "#0F0C20"
            }
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
            body: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { background-color: #0F0C20; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-[#E91E63] selection:text-white">
  <!-- Top Bar -->
  <header class="sticky top-0 z-40 bg-[#0F0C20]/90 backdrop-blur-md border-b border-white/5 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-[#E91E63] via-[#9C27B0] to-[#00E5FF] p-0.5 shadow-lg">
        <div class="w-full h-full bg-[#151226] rounded-[10px] flex items-center justify-center">
          <span class="material-symbols-outlined text-[#00E5FF] text-[20px]">donut_large</span>
        </div>
      </div>
      <div>
        <h1 class="font-display font-bold text-base tracking-tight text-white leading-tight">Piepie Challenge</h1>
        <p class="text-[10px] text-[#00E5FF] font-semibold tracking-wider uppercase">User Profile</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button class="w-9 h-9 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/80">
        <span class="material-symbols-outlined text-[19px]">notifications</span>
      </button>
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-[#E91E63] to-[#00E5FF] p-0.5">
        <div class="w-full h-full bg-[#1A162B] rounded-full flex items-center justify-center font-display font-bold text-xs text-white">AM</div>
      </div>
    </div>
  </header>

  <main class="px-4 py-4 max-w-md mx-auto space-y-4">
    <!-- Profile Form Block (Clean White Card Container) -->
    <div class="bg-white text-[#0F0C20] rounded-[16px] p-5 shadow-2xl space-y-4">
      <!-- Title & Athlete Badge -->
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div>
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Athlete Account</span>
          <h2 class="font-display text-xl font-bold text-[#0F0C20]">Profile</h2>
        </div>
        <div class="w-10 h-10 rounded-full bg-[#0F0C20] text-white flex items-center justify-center font-display font-bold text-sm">
          AM
        </div>
      </div>

      <!-- Race Number Field (Disabled/read-only input displaying 6919730) -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1 flex items-center justify-between">
          <span>Race Number</span>
          <span class="text-[10px] font-bold text-[#E91E63] uppercase">Locked</span>
        </label>
        <div class="relative">
          <input type="text" value="6919730" disabled class="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 font-mono font-bold text-sm tracking-wider cursor-not-allowed"/>
          <span class="material-symbols-outlined absolute right-3 top-2.5 text-slate-400 text-[18px]">lock</span>
        </div>
      </div>

      <!-- Form Input Fields (Dark rounded text inputs) -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Name for certificate</label>
          <input type="text" value="Alex Morgan" placeholder="Enter full legal name" class="w-full px-3.5 py-2.5 rounded-xl bg-[#17132B] border border-slate-700 text-white font-medium text-sm focus:outline-none focus:ring-2 focus:ring-[#00E5FF]"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Email address</label>
          <input type="email" value="alex.morgan@athlete.io" placeholder="athlete@domain.com" class="w-full px-3.5 py-2.5 rounded-xl bg-[#17132B] border border-slate-700 text-white font-medium text-sm focus:outline-none focus:ring-2 focus:ring-[#00E5FF]"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Cell phone number</label>
          <input type="tel" value="+1 (555) 234-8901" placeholder="+1 (555) 000-0000" class="w-full px-3.5 py-2.5 rounded-xl bg-[#17132B] border border-slate-700 text-white font-medium text-sm focus:outline-none focus:ring-2 focus:ring-[#00E5FF]"/>
        </div>
      </div>

      <!-- Challenge Selection Toggle (Side-by-side pill buttons) -->
      <div class="pt-1">
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Challenge Selection</label>
        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
          <!-- Classic (Selected/Highlighted in Pink) -->
          <button class="py-2.5 rounded-lg bg-[#E91E63] text-white font-display font-bold text-xs shadow-md flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-[15px]">check_circle</span>
            Classic
          </button>
          <!-- Ultra (Unselected) -->
          <button class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900 font-display font-semibold text-xs transition-colors">
            Ultra
          </button>
        </div>
      </div>

      <!-- Choose Activity/ies Grid -->
      <div class="pt-1">
        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Choose Activity/ies</label>
        <div class="grid grid-cols-3 gap-2">
          <!-- Run (Selected) -->
          <button class="p-2.5 rounded-xl bg-[#0F0C20] border-2 border-[#00E5FF] text-white flex flex-col items-center gap-1 shadow-sm">
            <span class="material-symbols-outlined text-[#00E5FF] text-[22px]">directions_run</span>
            <span class="text-[11px] font-bold">Run</span>
          </button>

          <!-- Cycle (Selected) -->
          <button class="p-2.5 rounded-xl bg-[#0F0C20] border-2 border-[#00E5FF] text-white flex flex-col items-center gap-1 shadow-sm">
            <span class="material-symbols-outlined text-[#00E5FF] text-[22px]">directions_bike</span>
            <span class="text-[11px] font-bold">Cycle</span>
          </button>

          <!-- Swim (Selected) -->
          <button class="p-2.5 rounded-xl bg-[#0F0C20] border-2 border-[#00E5FF] text-white flex flex-col items-center gap-1 shadow-sm">
            <span class="material-symbols-outlined text-[#00E5FF] text-[22px]">pool</span>
            <span class="text-[11px] font-bold">Swim</span>
          </button>

          <!-- Gym (Selected) -->
          <button class="p-2.5 rounded-xl bg-[#0F0C20] border-2 border-[#E91E63] text-white flex flex-col items-center gap-1 shadow-sm">
            <span class="material-symbols-outlined text-[#E91E63] text-[22px]">fitness_center</span>
            <span class="text-[11px] font-bold">Gym</span>
          </button>

          <!-- Stretch/Movement (Selected) -->
          <button class="p-2.5 rounded-xl bg-[#0F0C20] border-2 border-[#00E5FF] text-white flex flex-col items-center gap-1 shadow-sm">
            <span class="material-symbols-outlined text-[#00E5FF] text-[22px]">self_improvement</span>
            <span class="text-[11px] font-bold">Stretch</span>
          </button>

          <!-- Other Sports (Unselected) -->
          <button class="p-2.5 rounded-xl bg-slate-100 border border-slate-200 text-slate-500 hover:text-slate-800 flex flex-col items-center gap-1 transition-colors">
            <span class="material-symbols-outlined text-[22px]">sports_tennis</span>
            <span class="text-[11px] font-medium">Other Sports</span>
          </button>
        </div>
      </div>

      <!-- Action Buttons (Full-width rounded buttons) -->
      <div class="pt-3 space-y-2.5">
        <!-- Primary Pink Button: Save updates -->
        <button class="w-full py-3.5 rounded-xl bg-[#E91E63] hover:bg-[#d81557] text-white font-display font-bold text-sm shadow-[0_4px_16px_rgba(233,30,99,0.35)] flex items-center justify-center gap-2 transition-transform active:scale-[0.99]">
          <span class="material-symbols-outlined text-[18px]">save</span>
          Save updates
        </button>

        <!-- Secondary Blue Button: Get race number -->
        <button class="w-full py-3.5 rounded-xl bg-[#00E5FF] hover:bg-[#00cbe2] text-[#0F0C20] font-display font-bold text-sm shadow-md flex items-center justify-center gap-2 transition-transform active:scale-[0.99]">
          <span class="material-symbols-outlined text-[18px]">badge</span>
          Get race number
        </button>

        <!-- Primary Pink Button: View progress -->
        <button class="w-full py-3.5 rounded-xl bg-[#E91E63] hover:bg-[#d81557] text-white font-display font-bold text-sm shadow-[0_4px_16px_rgba(233,30,99,0.35)] flex items-center justify-center gap-2 transition-transform active:scale-[0.99]">
          <span class="material-symbols-outlined text-[18px]">trending_up</span>
          View progress
          <span class="material-symbols-outlined text-[18px] ml-1">arrow_forward</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0F0C20]/95 backdrop-blur-xl border-t border-white/10 px-6 py-2.5">
    <div class="flex items-center justify-around max-w-md mx-auto">
      <a href="#" class="flex flex-col items-center gap-1 text-white/50 hover:text-white transition-colors">
        <span class="material-symbols-outlined text-[24px]">home</span>
        <span class="text-[10px] font-semibold tracking-wide">Home</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-white/50 hover:text-white transition-colors">
        <span class="material-symbols-outlined text-[24px]">leaderboard</span>
        <span class="text-[10px] font-semibold tracking-wide">Activities</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-[#00E5FF]">
        <span class="material-symbols-outlined text-[24px]">person</span>
        <span class="text-[10px] font-semibold tracking-wide">Profile</span>
      </a>
    </div>
  </nav>
</body>
</html>
